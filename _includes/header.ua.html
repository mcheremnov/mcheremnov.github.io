<header>
    <div>
      <a class="site-title" href="{{ '/index.ua' | relative_url }}">{{ site.title_ua }}</a>
      <small>
        {% if site.tagshort_ua %}
        {{ site.tagshort_ua }}
        {% else %}
        {{ site.taglong_ua }}
        {% endif %}
      </small>
    </div>
    <a id="theme-toggle" class="toggle-icon" onclick="modeSwitcher()"></a>
  </header>
