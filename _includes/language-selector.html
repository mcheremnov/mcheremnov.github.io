<div class="language-group">
    {%- for lang in site.i18n_languages %}
    <button type="button" class="btn btn-outline-secondary btn-sm" data-set-lang="{{ lang }}"
        aria-label="{{ site.data.i18n[lang].lang_name }}" title="{{ site.data.i18n[lang].lang_name }}">
        {%- if lang == "uk" %}{% include svg/ua24x24.svg %}{% else %}{% include svg/us24x24.svg %}{% endif -%}
    </button>
    {%- endfor %}
</div>
