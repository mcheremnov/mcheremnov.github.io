title: Maksym Cheremnov
description: Fullstack developer for web applications
baseurl: ""
url: https://mcheremnov.github.io

theme: cvless

# languages: strings in _data/i18n/<lang>.yml, first one is the default
i18n_languages: ["en", "uk"]

# author settings
author:
  name: Maksym Cheremnov
  email: cheremnovmaksym@gmail.com
photo: assets/files/photo.jpeg
phone: +380 732090252

# social media links
profile:
  x: https://x.com/cheremnovmaksym
  instagram: https://www.instagram.com/maximazimov/
  linkedin: https://www.linkedin.com/in/maksym-cheremnov-682585171/
  github: https://github.com/mcheremnov
  dev: https://dev.to/mcheremnov

# build settings
permalink: pretty
exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor/
  - docker-compose.yml
  # posts hidden for now; remove these two lines to publish them again
  - _posts
  - posts.md

plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sourcemap: never

feed:
  path: atom.xml

whitelist:
  - jekyll-redirect-from
