<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.layout == "home" %}
    {{ site.title }}
    {% else %}
    {{ site.title }} &middot; {{ page.title }}
    {% endif %}
  </title>
  <script>
    // Pick language before first paint: ?lang= param, then saved choice, then browser language.
    window.I18N_LANGS = {{ site.i18n_languages | jsonify }};
    (function () {
      var langs = window.I18N_LANGS, lang = new URLSearchParams(location.search).get("lang");
      if (langs.indexOf(lang) === -1) {
        try { lang = localStorage.getItem("lang"); } catch (e) {}
      }
      if (langs.indexOf(lang) === -1) {
        lang = (navigator.language || "").slice(0, 2).toLowerCase();
      }
      document.documentElement.lang = langs.indexOf(lang) === -1 ? langs[0] : lang;
    })();
  </script>
  <style>
    {%- for lang in site.i18n_languages %}
    html:not([lang="{{ lang }}"]) [data-lang="{{ lang }}"] { display: none !important; }
    {%- endfor %}
    .header-actions { display: flex; align-items: center; gap: .75em; }
    .language-group { display: flex; gap: .5em; }
    /* Theme sizes the photo as 50% of the shrink-to-fit hero, so it resized when text width changed per language. */
    #particles-js .particles-photo { display: block; width: min(60vw, 35vh, max(16rem, 20vw)); aspect-ratio: 1; object-fit: cover; }
    /* Hero text scales with viewport: shrinks on phones (title is nowrap), grows on wide screens, with caps. */
    #particles-js .particles-title { font-size: min(8vw, max(2.5rem, 3.2vw), 4rem); }
    #particles-js .particles-subtitle { font-size: min(5vw, max(1.25rem, 1.6vw), 2rem); }
  </style>

  <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/open-color.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/styles.min.css' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/site.webmanifest' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">

  {% seo title=false %}
</head>
